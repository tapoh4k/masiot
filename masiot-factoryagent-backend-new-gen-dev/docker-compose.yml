# DEV infrastructure (used by ../start-dev.ps1).
# Production full stack: ../deploy/docker-compose.yml
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: agenti_postgres
    environment:
      POSTGRES_DB: agenti_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: agenti_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: full backend in Docker (prefer ../deploy for prod)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agenti_backend
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=agenti_db;Username=postgres;Password=postgres;Encoding=UTF8"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["with-backend"]

volumes:
  postgres_data:
